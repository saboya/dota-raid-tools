name: Release addon

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify addon ZIP
        run: python3 tools/package.py "$GITHUB_REF_NAME" --output-dir dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/DotaRaid-${GITHUB_REF_NAME}.zip"
          --verify-tag --generate-notes
